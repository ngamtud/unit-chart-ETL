<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Unit Chart ETL</title>
  <link href="https://fonts.googleapis.com/css2?family=Kanit:wght@400;500;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="css/styles.css">
</head>
<body>
  <header>
    <h1>Unit Chart ETL</h1>
  </header>

  <main>
    <!-- Upload Section -->
    <section id="upload-section">
      <h2>Upload Your Data</h2>
      <div id="upload-area" class="drag-drop">
        <p>Drag and drop your file here or click the button below to upload.</p>
        <input type="file" id="file-upload" accept=".csv" hidden>
        <button id="upload-button">Upload File</button>
      </div>
    </section>

    <!-- Transformation Section -->
    <section id="transform-section" class="hidden">
      <h2>Transformation Configuration</h2>
      <label for="value-per-unit">Value Per Unit:</label>
      <input type="number" id="value-per-unit" placeholder="Enter value per unit" value="5" required>
      <label for="units-per-row">Units Per Row:</label>
      <input type="number" id="units-per-row" placeholder="Enter units per row" value="5" required>
      <button id="transform-button">Transform Data</button>
    </section>

    <!-- Transformed Data Section -->
    <section id="result-section" class="hidden">
      <h2>Transformed Data</h2>
      <div id="result-table"></div>
      <p class="remark">* Only the first 10 rows are displayed for preview.</p>
      <button id="export-button" class="export-button">Export as CSV</button>
    </section>
  </main>

  <footer>
    <p>This app is for educational purposes only and does not store your data.</p>
    <p>
      Follow us: 
      <a href="https://www.youtube.com" target="_blank" aria-label="YouTube">
        <img src="https://cdn-icons-png.flaticon.com/128/1384/1384060.png" alt="YouTube" class="social-icon">
      </a>
      <a href="https://www.tableau.com" target="_blank" aria-label="Tableau">
        <img src="https://img.icons8.com/color/512/tableau-software.png" alt="Tableau" class="social-icon">
      </a>
    </p>
  </footer>
  <script src="js/main.js"></script>
</body>
</html>
